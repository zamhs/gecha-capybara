<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title desc">
  <title id="title">Mini capibara arropada con cariño</title>
  <desc id="desc">Bebé capibara de pelito caramelo, dormilón y sonriente, abrigado con mantita verde salvia, taza de té color crema, margaritas y corazones coral.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF5E6"/><stop offset=".6" stop-color="#F7E5D4"/><stop offset="1" stop-color="#F4D9C8"/></linearGradient>
    <linearGradient id="babyFur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E0B38A"/><stop offset=".48" stop-color="#CB9369"/><stop offset="1" stop-color="#A97453"/></linearGradient>
    <linearGradient id="babySnout" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0CCAA"/><stop offset="1" stop-color="#DCAA85"/></linearGradient>
    <linearGradient id="softBlanket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C5D8B9"/><stop offset=".5" stop-color="#A5BDA0"/><stop offset="1" stop-color="#87A58B"/></linearGradient>
    <linearGradient id="pillow" x1="0" y1="0" x2=".95" y2="1"><stop stop-color="#F8CCBE"/><stop offset="1" stop-color="#E7A596"/></linearGradient>
    <radialGradient id="rosy"><stop stop-color="#D97D78" stop-opacity=".5"/><stop offset="1" stop-color="#D97D78" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="dots" width="23" height="23" patternUnits="userSpaceOnUse"><circle cx="11.5" cy="11.5" r="1.5" fill="#FFF7E8" opacity=".65"/></pattern>
    <g id="petal"><path d="M0-18C9-21 13-10 7-3C16-11 25-3 17 6C11 12 5 10 3 7C9 20-2 25-9 17C-14 10-9 5-5 2C-19 8-23-4-14-10C-7-14-3-8-2-5C-8-18-2-22 0-18Z" fill="#FFFDF2"/><circle r="6" fill="#E7B675"/><circle cx="-1" cy="-2" r="1.6" fill="#FDE3BC"/></g>
    <g id="love"><path d="M0 8C-25-9-11-20 0-10C11-20 25-9 0 8Z" fill="#E8A294"/></g>
  </defs>
  <style>
    .floating-hearts, .tea-steam { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .floating-hearts { animation: baby-drift 5s ease-in-out infinite alternate; }
      .tea-steam { animation: baby-breathe 4s ease-in-out infinite alternate; }
    }
    @keyframes baby-drift { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    @keyframes baby-breathe { from { opacity: .58; transform: translateY(3px); } to { opacity: 1; transform: translateY(-5px); } }
  </style>

