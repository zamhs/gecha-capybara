<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
  <title id="title">Capibara con mantita y una taza de té para Gecha</title>
  <desc id="desc">Ilustración editorial tierna de una capibara color caramelo, arropada con una mantita salvia, sosteniendo una taza de té, rodeada de florecitas, corazones y un termómetro.</desc>
  <defs>
    <linearGradient id="ambient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF8EB"/><stop offset=".58" stop-color="#F9E9D8"/><stop offset="1" stop-color="#F5D8C8"/></linearGradient>
    <linearGradient id="fur" x1=".12" y1="0" x2=".91" y2="1"><stop stop-color="#D8A679"/><stop offset=".48" stop-color="#BF855C"/><stop offset="1" stop-color="#9D674B"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E0B086"/><stop offset=".58" stop-color="#C68E67"/><stop offset="1" stop-color="#AD7455"/></linearGradient>
    <linearGradient id="snout" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAC29A"/><stop offset="1" stop-color="#D6A17A"/></linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C7D7B7"/><stop offset=".48" stop-color="#A9C19F"/><stop offset="1" stop-color="#86A68B"/></linearGradient>
