  </defs>
  <style>
    /* Tiny, independent layers: animated even when embedded through an img tag. */
    .floating-hearts, .tea-steam { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .floating-hearts { animation: drift 5.4s ease-in-out infinite alternate; }
      .tea-steam { animation: breathe 4.2s ease-in-out infinite alternate; }
    }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-9px); } }
    @keyframes breathe { from { opacity: .58; transform: translateY(4px); } to { opacity: 1; transform: translateY(-5px); } }
  </style>

