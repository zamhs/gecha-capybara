    <radialGradient id="blush"><stop stop-color="#D77E74" stop-opacity=".56"/><stop offset="1" stop-color="#D77E74" stop-opacity="0"/></radialGradient>
    <pattern id="weave" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M0 15H30 M15 0V30" stroke="#F3F2D9" stroke-opacity=".12" stroke-width="2"/><circle cx="15" cy="15" r="1.7" fill="#F7EFD4" opacity=".5"/></pattern>
    <filter id="shadow" x="-35%" y="-50%" width="170%" height="220%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="5"/></filter>
    <g id="daisy"><path d="M0-20C9-22 13-11 7-4C18-12 27-2 18 7C10 15 5 10 3 8C8 24-4 28-10 18C-15 10-8 6-6 4C-21 10-26-3-16-10C-8-15-3-9-2-6C-9-21-1-25 0-20Z" fill="#FFF9E7"/><circle r="6.8" fill="#E9B57C"/><circle cx="-1.5" cy="-2" r="2" fill="#FFDFC0"/></g>
    <g id="sparkle"><path d="M0-17C1-4 4-1 17 0C4 1 1 4 0 17C-1 4-4 1-17 0C-4-1-1-4 0-17Z" fill="#E7BBA0"/></g>
